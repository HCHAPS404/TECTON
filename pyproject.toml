[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tecton-pnud"
version = "0.1.0"
description = "Pipeline temporal reproducible para la Hackathon PNUD Colombia"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "joblib==1.5.3",
  "catboost==1.2.8",
]

[dependency-groups]
dev = ["ruff==0.14.14", "nbformat==5.10.4", "nbclient==0.10.4", "ipykernel==6.30.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
